# Development defaults; calibrate using repeatable workloads before real tuning.
monitoring:
  interval_seconds: &metric_interval 5
  consecutive_bad_readings: &bad_readings 3
  history_size: 60
  max_timestamp_skew_seconds: 1
  max_sample_age_seconds: 7.5

tuning:
  observation_window_seconds: &observation_window 30
  cooldown_seconds: &cooldown 30
  one_action_at_a_time: true
  baseline_samples: 3
  minimum_observation_samples: 5
  # Client-observed owned-workload queries required per window to trust a KEEP decision.
  minimum_owned_queries: 30
  baseline_warmup_seconds: 15
  improvement_percent: 5
  degradation_percent: 10
  resource_degradation_percent: 20
  disk_noise_floor_bytes: 1048576
  # KEEP decision policy for owned-workload evaluations:
  #   net_benefit      - keep if weighted throughput gain outweighs latency cost
  #   latency_first    - keep only if per-query latency does not regress
  #   throughput_first - keep if throughput improves and errors do not rise
  keep_policy: net_benefit
  throughput_weight: 1.0
  latency_weight: 0.5
  # The global degradation_percent remains an independent hard limit.
  max_latency_regression_percent: 10
  # Do not retry a rolled-back reduction under comparable conditions for this long.
  rejection_memory_ttl_seconds: 1800

# Manual OS actions require explicit process and CPU whitelists.
os_actions:
  allowed_pids: []
  allowed_cpu_ids: []
  allowed_nice_values: [0, 5, 10]
  same_user_only: true

modes:
  default_mode: &default_mode recommendation

thresholds:
  cpu_high_percent: 90
  memory_high_percent: 85
  context_switches_high_per_interval: 3000
  active_workers_high: 4
  query_latency_high_ms: 200

safe_values:
  work_mem_mb: [4, 8, 16, 32, 64]
  max_parallel_workers_per_gather: &parallel_values [1, 2, 4, 6, 8]

# DBMS compatibility sections. Aliases reuse canonical autotuner settings above.
# OptiDBX Central Configuration
# Shared across OS monitor, DB monitor, Autotuner, and Dashboard

system:
  mode: *default_mode
  metric_interval_seconds: *metric_interval
  bad_readings_required: *bad_readings
  observation_window_seconds: *observation_window
  cooldown_seconds: *cooldown

database:
  host: localhost
  port: 5432
  name: optidbx
  user: optidbx_user
  # Password loaded from POSTGRES_PASSWORD environment variable

workload:
  default_tool: pgbench
  # API-owned sessions; external pgbench remains monitor-only.
  managed_clients: {LOW: 1, MEDIUM: 4, HIGH: 10}
  profiles:
    LOW:
      clients: 2
      threads: 2
      duration_seconds: 60
      scale_factor: 10
      description: "Low concurrency baseline workload"
    MEDIUM:
      clients: 10
      threads: 4
      duration_seconds: 60
      scale_factor: 20
      description: "Moderate concurrency workload"
    HIGH:
      clients: 50
      threads: 8
      duration_seconds: 90
      scale_factor: 50
      description: "High concurrency workload designed to trigger contention"

tuning_rules:
  dbms:
    work_mem:
      default: "4MB"
      allowed_values: ["4MB", "8MB", "16MB", "32MB", "64MB"]
    max_parallel_workers_per_gather:
      default: 2
      allowed_values: *parallel_values
    max_parallel_workers:
      default: 8
      allowed_values: [2, 4, 8, 12, 16]
  os:
    nice_priority:
      default: 0
      allowed_values: [-5, 0, 5, 10]
